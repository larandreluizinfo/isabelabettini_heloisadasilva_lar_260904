<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilo & Stitch - Aventura na Praia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }

        #startScreen {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 40%, #86a8e7 70%, #0077b6 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }
        #startScreen h1 { font-size: 3.5rem; color: white; text-shadow: 3px 3px 6px rgba(0,0,0,0.4); margin-bottom: 5px; }
        #startScreen h2 { font-size: 1.3rem; color: #fff3e0; margin-bottom: 30px; font-style: italic; }
        .chars { font-size: 80px; margin-bottom: 15px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
        #startBtn {
            padding: 15px 50px; font-size: 1.3rem; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #ff6f00, #ff8f00); color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #startBtn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,111,0,0.6); }

        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; z-index: 10; pointer-events: none;
        }
        .hud-item {
            color: white; font-size: 1.15rem; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.25); padding: 8px 16px; border-radius: 20px;
        }
        .hud-item span { color: #ffd54f; }

        #gameOverScreen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        #gameOverScreen h1 { font-size: 3rem; color: #ff8a65; margin-bottom: 10px; }
        #gameOverScreen p { color: white; font-size: 1.5rem; margin-bottom: 30px; }
        .btn-main {
            padding: 15px 50px; font-size: 1.3rem; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #ff6f00, #d84315); color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-main:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,111,0,0.6); }

        #winScreen {
            position: fixed; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 55;
        }
        #winCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #winContent {
            position: relative; z-index: 2; text-align: center;
            background: rgba(0,0,0,0.35); padding: 40px 60px; border-radius: 25px;
        }
        #winContent h1 { font-size: 3.5rem; color: #fff; text-shadow: 3px 3px 8px rgba(0,0,0,0.6); margin-bottom: 8px; }
        #winContent p { color: #e0f7fa; font-size: 1.4rem; margin-bottom: 25px; }
        #winContent .btn-main { background: linear-gradient(135deg, #00bcd4, #0097a7); color: white; }
        #winContent .btn-main:hover { box-shadow: 0 0 30px rgba(0,188,212,0.6); }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="chars">👧🏿 👽</div>
        <h1>Lilo & Stitch</h1>
        <h2>Aventura na Praia!</h2>
        <button id="startBtn">Jogar</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">🌺 Coletáveis: <span id="score">0</span> / <span id="total">10</span></div>
        <div class="hud-item">❤️ Vidas: <span id="lives">3</span></div>
        <div class="hud-item">🌊 Nível: <span id="level">1</span></div>
    </div>

    <div id="gameOverScreen">
        <h1>Fim de Jogo!</h1>
        <p>Coletáveis: <span id="finalScore">0</span> / <span id="finalTotal">10</span></p>
        <button id="restartBtn" class="btn-main">Jogar Novamente</button>
    </div>

    <div id="winScreen">
        <canvas id="winCanvas"></canvas>
        <div id="winContent">
            <h1 id="winTitle">Ohana!</h1>
            <p id="winMsg">Lilo e Stitch navegando juntos! 🌊</p>
            <button id="restartBtn2" class="btn-main">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        let gameRunning = false, collected = 0, totalItems = 10, lives = 3, level = 1;
        let frame = 0, spawnTimer = 0, invincible = false, invincibleTimer = 0;
        let particles = [], enemies = [], collectibles = [], coconuts = [], waves = [], bubbles = [];
        for (let i = 0; i < 5; i++) waves.push({ phase: Math.random()*Math.PI*2 });

        const stitch = { x: 0, y: 0, w: 44, h: 44, vx: 0, vy: 0, speed: 5.5, dir: 1 };
        const lilo = { x: 0, y: 0, w: 42, h: 42, vx: 0, vy: 0, targetX: 0, targetY: 0, bobPhase: 0, dir: 1 };

        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);
        let mouseX = 0, mouseY = 0, mouseDown = false;
        canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('touchstart', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; mouseDown = true; });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
        canvas.addEventListener('touchend', () => mouseDown = false);

        function spawnCollectible() {
            const items = ['🌺','🌸','🍹','🐚','⭐','🎵','🏄','🍉','🎸','🍍'];
            const x = Math.random()*(W-80)+40;
            const y = Math.random()*(H*0.45)+H*0.18;
            collectibles.push({
                x, y, w: 30, h: 30, type: items[Math.floor(Math.random()*items.length)],
                bobPhase: Math.random()*Math.PI*2, bobSpeed: 0.03+Math.random()*0.03,
                bobAmp: 4+Math.random()*4, baseY: y, glow: Math.random()*Math.PI*2
            });
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random()*4);
            let x, y, vx, vy;
            const spd = 1.6+level*0.3;
            if (side===0) { x=-30; y=Math.random()*H*0.85; vx=spd; vy=(Math.random()-0.5)*1.5; }
            else if (side===1) { x=W+30; y=Math.random()*H*0.85; vx=-spd; vy=(Math.random()-0.5)*1.5; }
            else if (side===2) { x=Math.random()*W; y=-30; vx=(Math.random()-0.5)*1.5; vy=spd; }
            else { x=Math.random()*W; y=H+30; vx=(Math.random()-0.5)*1.5; vy=-spd; }
            const types = ['🦀','🐙','🦞','🐡'];
            enemies.push({ x, y, vx, vy, w: 28+Math.random()*10, h: 28+Math.random()*10, type: types[Math.floor(Math.random()*types.length)], rot: 0 });
        }

        function spawnCoconut() {
            const px = Math.random()<0.5 ? W*0.08 : W*0.92;
            coconuts.push({ x: px, y: H*0.28, vx: (Math.random()-0.5)*3, vy: 2.2+Math.random(), w: 18, h: 18 });
        }

        function spawnBubble(x, y) {
            bubbles.push({ x: x+(Math.random()-0.5)*20, y, vy: -1-Math.random()*2, life: 40+Math.random()*20, r: 2+Math.random()*3 });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 25+Math.random()*15, maxLife: 40, color, size: 2+Math.random()*3 });
            }
        }

        function drawBeach() {
            const sky = ctx.createLinearGradient(0,0,0,H*0.45);
            sky.addColorStop(0,'#ff7043'); sky.addColorStop(0.4,'#ffb74d'); sky.addColorStop(1,'#81d4fa');
            ctx.fillStyle = sky; ctx.fillRect(0,0,W,H*0.5);

            const sunX = W*0.8, sunY = H*0.18;
            const sg = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,60);
            sg.addColorStop(0,'rgba(255,241,118,1)'); sg.addColorStop(0.5,'rgba(255,183,77,0.6)'); sg.addColorStop(1,'rgba(255,183,77,0)');
            ctx.fillStyle = sg; ctx.fillRect(sunX-80,sunY-80,160,160);
            ctx.beginPath(); ctx.arc(sunX,sunY,30,0,Math.PI*2); ctx.fillStyle='#fff9c4'; ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            for (let i = 0; i < 4; i++) {
                const cx = ((i*W*0.3+frame*0.3)%(W+200))-100, cy = H*0.12+i*18;
                ctx.beginPath(); ctx.arc(cx,cy,22,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx+18,cy+8,17,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx-13,cy+10,15,0,Math.PI*2); ctx.fill();
            }

            const waterY = H*0.45;
            const wg = ctx.createLinearGradient(0,waterY,0,H*0.65);
            wg.addColorStop(0,'#0288d1'); wg.addColorStop(1,'#01579b');
            ctx.fillStyle = wg; ctx.fillRect(0,waterY,W,H*0.2);

            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
            for (const w of waves) {
                ctx.beginPath();
                for (let x = 0; x <= W; x += 5) {
                    const y = waterY+Math.sin(x*0.01+w.phase+frame*0.03)*6+15;
                    x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                }
                ctx.stroke();
                w.phase += 0.005;
            }

            const sandY = H*0.62;
            const sand = ctx.createLinearGradient(0,sandY,0,H);
            sand.addColorStop(0,'#fdd835'); sand.addColorStop(0.4,'#f9a825'); sand.addColorStop(1,'#e65100');
            ctx.fillStyle = sand; ctx.fillRect(0,sandY,W,H-sandY);

            for (let i = 0; i < 15; i++) {
                const sx = (i*173+frame*0.15)%W, sy = sandY+10+(i*67)%(H*0.35);
                ctx.fillStyle = `rgba(255,255,255,${0.2+Math.sin(frame*0.06+i)*0.2})`;
                ctx.fillRect(sx,sy,2,2);
            }

            drawPalm(W*0.08, H*0.58); drawPalm(W*0.92, H*0.56);
            if (level > 1) drawPalm(W*0.5, H*0.54);
        }

        function drawPalm(x, baseY) {
            ctx.fillStyle = '#5d4037';
            ctx.beginPath();
            ctx.moveTo(x-6,baseY); ctx.lineTo(x+6,baseY); ctx.lineTo(x+4,baseY-90); ctx.lineTo(x-4,baseY-90);
            ctx.fill();
            const topY = baseY-90;
            ctx.fillStyle = '#2e7d32';
            for (let a = 0; a < 6; a++) {
                const angle = (a/6)*Math.PI*2+Math.sin(frame*0.02+a)*0.1;
                ctx.beginPath(); ctx.moveTo(x,topY);
                const ex = x+Math.cos(angle)*50, ey = topY+Math.sin(angle)*20-10;
                ctx.quadraticCurveTo(x+Math.cos(angle)*25, topY+Math.sin(angle)*5-20, ex, ey);
                ctx.quadraticCurveTo(x+Math.cos(angle)*25, topY+Math.sin(angle)*5+5, x, topY);
                ctx.fill();
            }
        }

        function drawCharacter(emoji, x, y, size, dir, isInvincible, alpha) {
            ctx.save();
            if (alpha !== undefined) ctx.globalAlpha = alpha;
            if (isInvincible && Math.floor(frame/4)%2===0) ctx.globalAlpha = 0.35;
            ctx.font = `${size}px serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            if (dir < 0) {
                ctx.translate(x, y); ctx.scale(-1, 1);
                ctx.fillText(emoji, 0, 0);
            } else {
                ctx.fillText(emoji, x, y);
            }
            ctx.restore();
        }

        function update() {
            frame++;

            // Stitch movement
            stitch.vx = 0; stitch.vy = 0;
            if (keys['ArrowLeft']||keys['a']) { stitch.vx = -stitch.speed; stitch.dir = -1; }
            if (keys['ArrowRight']||keys['d']) { stitch.vx = stitch.speed; stitch.dir = 1; }
            if (keys['ArrowUp']||keys['w']) stitch.vy = -stitch.speed;
            if (keys['ArrowDown']||keys['s']) stitch.vy = stitch.speed;
            if (mouseDown) {
                const dx = mouseX-stitch.x, dy = mouseY-stitch.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist > 5) {
                    stitch.vx = (dx/dist)*stitch.speed; stitch.vy = (dy/dist)*stitch.speed;
                    stitch.dir = dx > 0 ? 1 : -1;
                }
            }

            stitch.x += stitch.vx; stitch.y += stitch.vy;
            stitch.x = Math.max(stitch.w/2, Math.min(W-stitch.w/2, stitch.x));
            stitch.y = Math.max(stitch.h/2, Math.min(H-stitch.h/2, stitch.y));

            // Lilo follows Stitch
            const liloOffsetX = -55, liloOffsetY = 15;
            lilo.targetX = stitch.x + liloOffsetX * stitch.dir;
            lilo.targetY = stitch.y + liloOffsetY + Math.sin(frame*0.06)*4;
            const ldx = lilo.targetX - lilo.x, ldy = lilo.targetY - lilo.y;
            lilo.x += ldx * 0.08; lilo.y += ldy * 0.08;
            lilo.dir = ldx < -1 ? -1 : ldx > 1 ? 1 : lilo.dir;

            if (invincible) { invincibleTimer--; if (invincibleTimer<=0) invincible = false; }

            spawnTimer++;
            if (spawnTimer > Math.max(40, 90-level*4)) { spawnEnemy(); spawnTimer = 0; }
            if (frame % 180 === 0 && coconuts.length < 3) spawnCoconut();

            for (const c of collectibles) {
                c.y = c.baseY + Math.sin(frame*c.bobSpeed+c.bobPhase)*c.bobAmp;
                c.glow += 0.05;
            }

            // bubbles near water
            if (frame % 10 === 0) spawnBubble(Math.random()*W, H*0.5+Math.random()*H*0.12);

            // collision: enemies vs stitch
            for (let i = enemies.length-1; i >= 0; i--) {
                const e = enemies[i]; e.x += e.vx; e.y += e.vy; e.rot += 0.05;
                if (e.x<-50||e.x>W+50||e.y<-50||e.y>H+50) { enemies.splice(i,1); continue; }

                const dxs = stitch.x-e.x, dys = stitch.y-e.y;
                if (Math.sqrt(dxs*dxs+dys*dys) < stitch.w/2+e.w/2) {
                    if (!invincible) {
                        lives--; createParticles(stitch.x,stitch.y,'#ff5252',15);
                        invincible = true; invincibleTimer = 80;
                        if (lives<=0) { gameOver(); return; }
                    }
                    createParticles(e.x,e.y,'#ffb74d',10); enemies.splice(i,1); continue;
                }

                const dxl = lilo.x-e.x, dyl = lilo.y-e.y;
                if (Math.sqrt(dxl*dxl+dyl*dyl) < lilo.w/2+e.w/2) {
                    if (!invincible) {
                        lives--; createParticles(lilo.x,lilo.y,'#ff5252',15);
                        invincible = true; invincibleTimer = 80;
                        if (lives<=0) { gameOver(); return; }
                    }
                    createParticles(e.x,e.y,'#ffb74d',10); enemies.splice(i,1);
                }
            }

            // coconuts
            for (let i = coconuts.length-1; i >= 0; i--) {
                const c = coconuts[i]; c.x += c.vx; c.y += c.vy;
                if (c.y>H+20||c.x<-20||c.x>W+20) { coconuts.splice(i,1); continue; }
                const dx = stitch.x-c.x, dy = stitch.y-c.y;
                if (Math.sqrt(dx*dx+dy*dy) < stitch.w/2+c.w/2) {
                    if (!invincible) {
                        lives--; createParticles(stitch.x,stitch.y,'#8d6e63',12);
                        invincible = true; invincibleTimer = 60;
                        if (lives<=0) { gameOver(); return; }
                    }
                    coconuts.splice(i,1);
                }
            }

            // collectibles - stitch OR lilo can collect
            for (let i = collectibles.length-1; i >= 0; i--) {
                const c = collectibles[i];
                const ds = Math.sqrt((stitch.x-c.x)**2+(stitch.y-c.y)**2);
                const dl = Math.sqrt((lilo.x-c.x)**2+(lilo.y-c.y)**2);
                if (ds < stitch.w/2+c.w/2 || dl < lilo.w/2+c.w/2) {
                    collected++;
                    createParticles(c.x,c.y,'#ff80ab',20);
                    createParticles(c.x,c.y,'#ffd54f',10);
                    collectibles.splice(i,1);
                    if (collected >= totalItems) { winGame(); return; }
                }
            }

            if (collected > 0 && collected % 5 === 0 && collectibles.length === 0) {
                level++; totalItems += 5;
                document.getElementById('total').textContent = totalItems;
                for (let i = 0; i < totalItems-collected; i++) spawnCollectible();
            }

            for (let i = particles.length-1; i >= 0; i--) {
                const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life--;
                if (p.life<=0) particles.splice(i,1);
            }

            for (let i = bubbles.length-1; i >= 0; i--) {
                const b = bubbles[i]; b.y += b.vy; b.x += Math.sin(frame*0.1+i)*0.3; b.life--;
                if (b.life<=0) bubbles.splice(i,1);
            }

            document.getElementById('score').textContent = collected;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function draw() {
            ctx.clearRect(0,0,W,H);
            drawBeach();

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            // bubbles
            for (const b of bubbles) {
                const a = b.life/60;
                ctx.globalAlpha = a*0.5;
                ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // collectibles with glow
            for (const c of collectibles) {
                ctx.save();
                ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 12+Math.sin(c.glow)*6;
                ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(c.type, c.x, c.y);
                ctx.restore();
            }

            // coconuts
            ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (const c of coconuts) { ctx.fillText('🥥', c.x, c.y); }

            // enemies
            for (const e of enemies) {
                ctx.save();
                ctx.font = `${e.w}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.translate(e.x, e.y); ctx.rotate(e.rot);
                ctx.fillText(e.type, 0, 0);
                ctx.restore();
            }

            // Lilo
            if (invincible) { ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20; }
            drawCharacter('👧🏿', lilo.x, lilo.y, lilo.w, lilo.dir, invincible);
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

            // Stitch
            if (invincible) { ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20; }
            drawCharacter('👽', stitch.x, stitch.y, stitch.w, stitch.dir, invincible);
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

            // name tags
            ctx.font = 'bold 11px Segoe UI, sans-serif';
            ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.strokeText('Stitch', stitch.x, stitch.y-stitch.w/2-10);
            ctx.fillText('Stitch', stitch.x, stitch.y-stitch.w/2-10);
            ctx.fillStyle = '#fff8e1';
            ctx.strokeText('Lilo', lilo.x, lilo.y-lilo.w/2-10);
            ctx.fillText('Lilo', lilo.x, lilo.y-lilo.w/2-10);

            // particles
            for (const p of particles) {
                const a = p.life/p.maxLife;
                ctx.globalAlpha=a; ctx.fillStyle=p.color;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha=1;

            // stitch trail
            if (Math.abs(stitch.vx)>0.5||Math.abs(stitch.vy)>0.5) {
                ctx.globalAlpha = 0.15;
                ctx.font = `${stitch.w*0.5}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('👽', stitch.x-stitch.vx*2, stitch.y-stitch.vy*2);
                ctx.globalAlpha = 1;
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = collected;
            document.getElementById('finalTotal').textContent = totalItems;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function winGame() {
            gameRunning = false;
            document.getElementById('winScreen').style.display = 'flex';
        }

        function resetGame() {
            collected = 0; lives = 3; level = 1; totalItems = 10;
            frame = 0; spawnTimer = 0; invincible = false;
            particles = []; enemies = []; collectibles = []; coconuts = []; bubbles = [];
            stitch.x = W/2; stitch.y = H/2; stitch.vx = 0; stitch.vy = 0; stitch.dir = 1;
            lilo.x = W/2-55; lilo.y = H/2+15; lilo.vx = 0; lilo.vy = 0; lilo.dir = -1;
            document.getElementById('total').textContent = totalItems;
            for (let i = 0; i < totalItems; i++) spawnCollectible();
            gameRunning = true;
        }

        function loop() { if (gameRunning) { update(); draw(); } requestAnimationFrame(loop); }

        document.getElementById('startBtn').addEventListener('click', () => { document.getElementById('startScreen').style.display='none'; resetGame(); });
        document.getElementById('restartBtn').addEventListener('click', () => { document.getElementById('gameOverScreen').style.display='none'; resetGame(); });
        document.getElementById('restartBtn2').addEventListener('click', () => { winActive = false; document.getElementById('winScreen').style.display='none'; resetGame(); });

        // ===== WIN SCREEN OCEAN ANIMATION =====
        const winCanvas = document.getElementById('winCanvas');
        const wctx = winCanvas.getContext('2d');
        let wW, wH, winFrame = 0, winActive = false;
        let winFish = [], winBubbles = [], winWaves = [], winCorals = [], winStars = [];

        function resizeWin() {
            wW = winCanvas.width = window.innerWidth;
            wH = winCanvas.height = window.innerHeight;
        }
        resizeWin();
        window.addEventListener('resize', resizeWin);

        function initWinScene() {
            winFrame = 0; winActive = true;
            winFish = []; winBubbles = []; winWaves = []; winCorals = []; winStars = [];

            for (let i = 0; i < 6; i++) {
                winFish.push({
                    x: Math.random()*wW, y: wH*0.3+Math.random()*wH*0.35,
                    speed: 0.8+Math.random()*1.5, dir: Math.random()<0.5?1:-1,
                    emoji: ['🐟','🐠','🐡','🦈','🐬','🐙'][i],
                    size: 22+Math.random()*14, bobPhase: Math.random()*Math.PI*2
                });
            }

            for (let i = 0; i < 25; i++) {
                winBubbles.push({
                    x: Math.random()*wW, y: wH*0.5+Math.random()*wH*0.5,
                    r: 2+Math.random()*5, speed: 0.3+Math.random()*0.8,
                    phase: Math.random()*Math.PI*2
                });
            }

            for (let i = 0; i < 4; i++) {
                winWaves.push({ phase: Math.random()*Math.PI*2, speed: 0.015+Math.random()*0.01, amp: 8+Math.random()*6, y: wH*0.38+i*12 });
            }

            const coralEmojis = ['🪸','🪸','🪸'];
            for (let i = 0; i < 8; i++) {
                winCorals.push({ x: Math.random()*wW, y: wH*0.82+Math.random()*wH*0.12,
                    emoji: coralEmojis[Math.floor(Math.random()*coralEmojis.length)],
                    size: 20+Math.random()*18 });
            }

            for (let i = 0; i < 12; i++) {
                winStars.push({ x: Math.random()*wW, y: wH*0.75+Math.random()*wH*0.15,
                    phase: Math.random()*Math.PI*2 });
            }
        }

        function updateWin() {
            winFrame++;

            for (const f of winFish) {
                f.x += f.speed * f.dir;
                if (f.x > wW+50) { f.x = -40; f.y = wH*0.3+Math.random()*wH*0.35; }
                if (f.x < -50) { f.x = wW+40; f.y = wH*0.3+Math.random()*wH*0.35; }
            }

            for (const b of winBubbles) {
                b.y -= b.speed;
                b.x += Math.sin(winFrame*0.03+b.phase)*0.4;
                if (b.y < wH*0.2) { b.y = wH*0.5+Math.random()*wH*0.5; b.x = Math.random()*wW; }
            }
        }

        function drawWin() {
            // deep ocean gradient
            const g = wctx.createLinearGradient(0,0,0,wH);
            g.addColorStop(0, '#0277bd'); g.addColorStop(0.25, '#01579b');
            g.addColorStop(0.5, '#0d47a1'); g.addColorStop(0.75, '#0a2351');
            g.addColorStop(1, '#061233');
            wctx.fillStyle = g; wctx.fillRect(0,0,wW,wH);

            // light rays from surface
            wctx.save(); wctx.globalAlpha = 0.06;
            for (let i = 0; i < 5; i++) {
                const rx = wW*0.15+i*wW*0.18;
                const grd = wctx.createLinearGradient(rx, 0, rx+40, wH*0.7);
                grd.addColorStop(0, '#4fc3f7'); grd.addColorStop(1, 'transparent');
                wctx.fillStyle = grd;
                wctx.beginPath();
                wctx.moveTo(rx, 0); wctx.lineTo(rx+80, 0);
                wctx.lineTo(rx+120+Math.sin(winFrame*0.01+i)*20, wH*0.7);
                wctx.lineTo(rx+60+Math.sin(winFrame*0.01+i)*20, wH*0.7);
                wctx.fill();
            }
            wctx.restore();

            // waves at surface
            for (const w of winWaves) {
                wctx.strokeStyle = 'rgba(129,212,250,0.3)'; wctx.lineWidth = 2;
                wctx.beginPath();
                for (let x = 0; x <= wW; x += 4) {
                    const y = w.y + Math.sin(x*0.008+w.phase+winFrame*w.speed)*w.amp;
                    x===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y);
                }
                wctx.stroke();
            }

            // bubbles
            for (const b of winBubbles) {
                wctx.globalAlpha = 0.25+Math.sin(winFrame*0.05+b.phase)*0.15;
                wctx.strokeStyle = 'rgba(179,229,252,0.7)'; wctx.lineWidth = 1;
                wctx.beginPath(); wctx.arc(b.x, b.y, b.r, 0, Math.PI*2); wctx.stroke();
                // highlight
                wctx.fillStyle = 'rgba(255,255,255,0.3)';
                wctx.beginPath(); wctx.arc(b.x-b.r*0.3, b.y-b.r*0.3, b.r*0.25, 0, Math.PI*2); wctx.fill();
            }
            wctx.globalAlpha = 1;

            // fish
            wctx.textAlign = 'center'; wctx.textBaseline = 'middle';
            for (const f of winFish) {
                const by = f.y + Math.sin(winFrame*0.04+f.bobPhase)*6;
                wctx.save();
                wctx.font = `${f.size}px serif`;
                if (f.dir < 0) { wctx.translate(f.x, by); wctx.scale(-1,1); wctx.fillText(f.emoji,0,0); }
                else { wctx.fillText(f.emoji, f.x, by); }
                wctx.restore();
            }

            // coral & starfish
            for (const c of winCorals) {
                wctx.font = `${c.size}px serif`;
                wctx.fillText(c.emoji, c.x, c.y);
            }
            for (const s of winStars) {
                const sy = s.y + Math.sin(winFrame*0.02+s.phase)*3;
                wctx.save();
                wctx.shadowColor = '#ffd54f'; wctx.shadowBlur = 8;
                wctx.font = '20px serif';
                wctx.fillText('⭐', s.x, sy);
                wctx.restore();
            }

            // Lilo & Stitch on surfboard
            const surfX = wW*0.5 + Math.sin(winFrame*0.015)*60;
            const surfY = wH*0.38 + Math.sin(winFrame*0.025)*8;

            // surfboard
            wctx.save();
            wctx.translate(surfX, surfY);
            wctx.rotate(Math.sin(winFrame*0.02)*0.08);
            wctx.fillStyle = '#ff6f00';
            wctx.beginPath();
            wctx.ellipse(0, 12, 45, 8, 0, 0, Math.PI*2);
            wctx.fill();
            wctx.fillStyle = '#ffab00';
            wctx.beginPath();
            wctx.ellipse(0, 12, 30, 5, 0, 0, Math.PI*2);
            wctx.fill();
            // characters on surfboard
            wctx.font = '36px serif'; wctx.textAlign = 'center'; wctx.textBaseline = 'middle';
            wctx.fillText('👧🏿', -18, -5);
            wctx.fillText('👽', 18, -5);
            wctx.restore();

            // sparkles
            for (let i = 0; i < 8; i++) {
                const sx = (i*wW*0.13+winFrame*0.5)%wW;
                const sy = wH*0.1+Math.sin(winFrame*0.03+i*2)*wH*0.35;
                const brightness = Math.sin(winFrame*0.08+i)*0.4+0.5;
                wctx.fillStyle = `rgba(255,255,255,${brightness})`;
                wctx.beginPath(); wctx.arc(sx,sy,1.5,0,Math.PI*2); wctx.fill();
            }
        }

        function winLoop() {
            if (!winActive) return;
            updateWin(); drawWin();
            requestAnimationFrame(winLoop);
        }

        const origWin = winGame;
        winGame = function() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = collected;
            document.getElementById('finalTotal').textContent = totalItems;
            document.getElementById('winScreen').style.display = 'flex';
            resizeWin(); initWinScene(); winLoop();
        };

        stitch.x = W/2; stitch.y = H/2;
        lilo.x = W/2-55; lilo.y = H/2+15;
        loop();
    </script>
</body>
</html>
