<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilo & Stitch - Jogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #1a1a2e;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #startScreen h1 {
            font-size: 3.5rem;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            margin-bottom: 10px;
        }

        #startScreen h2 {
            font-size: 1.5rem;
            color: #b388ff;
            margin-bottom: 40px;
        }

        .stitch-art {
            font-size: 120px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        #startBtn {
            padding: 15px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00e5ff, #00bcd4);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            background: rgba(0,0,0,0.3);
            padding: 8px 18px;
            border-radius: 20px;
        }

        .hud-item span {
            color: #00e5ff;
        }

        #gameOverScreen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #gameOverScreen h1 {
            font-size: 3rem;
            color: #ff5252;
            margin-bottom: 10px;
        }

        #gameOverScreen p {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        #restartBtn {
            padding: 15px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 82, 82, 0.6);
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="stitch-art">👽</div>
        <h1>Lilo & Stitch</h1>
        <h2>Ohana Means Family</h2>
        <button id="startBtn">Jogar</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">⭐ Pontos: <span id="score">0</span></div>
        <div class="hud-item">❤️ Vidas: <span id="lives">3</span></div>
        <div class="hud-item">🌊 Nível: <span id="level">1</span></div>
    </div>

    <div id="gameOverScreen">
        <h1>Game Over!</h1>
        <p>Pontuação final: <span id="finalScore">0</span></p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let spawnTimer = 0;
        let starTimer = 0;
        let frame = 0;
        let particles = [];
        let stars = [];
        let enemies = [];
        let starPowerups = [];
        let invincible = false;
        let invincibleTimer = 0;

        const stitch = {
            x: 0, y: 0,
            w: 50, h: 50,
            vx: 0, vy: 0,
            speed: 6,
            color: '#00bcd4',
            emoji: '👽'
        };

        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        let mouseX = 0, mouseY = 0, mouseDown = false;
        canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('touchstart', e => {
            const t = e.touches[0];
            mouseX = t.clientX;
            mouseY = t.clientY;
            mouseDown = true;
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            mouseX = t.clientX;
            mouseY = t.clientY;
        });
        canvas.addEventListener('touchend', () => mouseDown = false);

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const spd = 2 + level * 0.5;
            if (side === 0) { x = -30; y = Math.random() * H; vx = spd; vy = (Math.random() - 0.5) * 2; }
            else if (side === 1) { x = W + 30; y = Math.random() * H; vx = -spd; vy = (Math.random() - 0.5) * 2; }
            else if (side === 2) { x = Math.random() * W; y = -30; vx = (Math.random() - 0.5) * 2; vy = spd; }
            else { x = Math.random() * W; y = H + 30; vx = (Math.random() - 0.5) * 2; vy = -spd; }

            const types = ['🛸', '🤖', '👾', '💀'];
            const type = types[Math.floor(Math.random() * types.length)];
            const size = 30 + Math.random() * 15;
            enemies.push({ x, y, vx, vy, w: size, h: size, type, hp: 1 });
        }

        function spawnStar() {
            starPowerups.push({
                x: Math.random() * (W - 40) + 20,
                y: -20,
                vy: 1.5,
                w: 25, h: 25
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,
                    color,
                    size: 3 + Math.random() * 4
                });
            }
        }

        function update() {
            frame++;

            stitch.vx = 0;
            stitch.vy = 0;
            if (keys['ArrowLeft'] || keys['a']) stitch.vx = -stitch.speed;
            if (keys['ArrowRight'] || keys['d']) stitch.vx = stitch.speed;
            if (keys['ArrowUp'] || keys['w']) stitch.vy = -stitch.speed;
            if (keys['ArrowDown'] || keys['s']) stitch.vy = stitch.speed;

            if (mouseDown) {
                const dx = mouseX - stitch.x;
                const dy = mouseY - stitch.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5) {
                    stitch.vx = (dx / dist) * stitch.speed;
                    stitch.vy = (dy / dist) * stitch.speed;
                }
            }

            stitch.x += stitch.vx;
            stitch.y += stitch.vy;
            stitch.x = Math.max(stitch.w / 2, Math.min(W - stitch.w / 2, stitch.x));
            stitch.y = Math.max(stitch.h / 2, Math.min(H - stitch.h / 2, stitch.y));

            if (invincible) {
                invincibleTimer--;
                if (invincibleTimer <= 0) invincible = false;
            }

            spawnTimer++;
            if (spawnTimer > Math.max(30, 80 - level * 5)) {
                spawnEnemy();
                spawnTimer = 0;
            }

            starTimer++;
            if (starTimer > 300) {
                spawnStar();
                starTimer = 0;
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                if (e.x < -50 || e.x > W + 50 || e.y < -50 || e.y > H + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                const dx = stitch.x - e.x;
                const dy = stitch.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < stitch.w / 2 + e.w / 2) {
                    if (!invincible) {
                        lives--;
                        createParticles(stitch.x, stitch.y, '#ff5252', 15);
                        invincible = true;
                        invincibleTimer = 90;
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                    createParticles(e.x, e.y, '#ffab00', 10);
                    enemies.splice(i, 1);
                }
            }

            for (let i = starPowerups.length - 1; i >= 0; i--) {
                const s = starPowerups[i];
                s.y += s.vy;

                if (s.y > H + 20) {
                    starPowerups.splice(i, 1);
                    continue;
                }

                const dx = stitch.x - s.x;
                const dy = stitch.y - s.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < stitch.w / 2 + s.w / 2) {
                    score += 50;
                    createParticles(s.x, s.y, '#ffd700', 20);
                    starPowerups.splice(i, 1);
                }
            }

            if (score >= level * 200) {
                level++;
                createParticles(W / 2, H / 2, '#00e5ff', 30);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a2e');
            grad.addColorStop(0.5, '#1a1a4e');
            grad.addColorStop(1, '#0d3b66');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            for (let i = 0; i < 50; i++) {
                const sx = (i * 137.5 + frame * 0.2) % W;
                const sy = (i * 97.3) % H;
                const brightness = 0.3 + Math.sin(frame * 0.05 + i) * 0.3;
                ctx.fillStyle = `rgba(255,255,255,${brightness})`;
                ctx.fillRect(sx, sy, 2, 2);
            }

            ctx.font = '40px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (const s of starPowerups) {
                ctx.save();
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.fillText('⭐', s.x, s.y);
                ctx.restore();
            }

            for (const e of enemies) {
                ctx.font = `${e.w}px serif`;
                ctx.fillText(e.type, e.x, e.y);
            }

            ctx.save();
            if (invincible && Math.floor(frame / 4) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }
            if (invincible) {
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 25;
            }
            ctx.font = `${stitch.w}px serif`;
            ctx.fillText(stitch.emoji, stitch.x, stitch.y);
            ctx.restore();

            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            spawnTimer = 0;
            starTimer = 0;
            frame = 0;
            particles = [];
            enemies = [];
            starPowerups = [];
            invincible = false;
            stitch.x = W / 2;
            stitch.y = H / 2;
            stitch.vx = 0;
            stitch.vy = 0;
            gameRunning = true;
        }

        function loop() {
            if (gameRunning) {
                update();
                draw();
            }
            requestAnimationFrame(loop);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            resetGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').style.display = 'none';
            resetGame();
        });

        stitch.x = W / 2;
        stitch.y = H / 2;
        loop();
    </script>
</body>
</html>
