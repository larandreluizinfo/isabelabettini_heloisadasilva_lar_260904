<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilo & Stitch - Praia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #87CEEB;
        }

        #startScreen {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 40%, #86a8e7 70%, #0077b6 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }

        #startScreen h1 {
            font-size: 3.5rem; color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            margin-bottom: 5px;
        }

        #startScreen h2 {
            font-size: 1.3rem; color: #fff3e0; margin-bottom: 30px;
            font-style: italic;
        }

        .stitch-art { font-size: 120px; margin-bottom: 15px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

        #startBtn {
            padding: 15px 50px; font-size: 1.3rem; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #ff6f00, #ff8f00); color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #startBtn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,111,0,0.6); }

        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; z-index: 10; pointer-events: none;
        }

        .hud-item {
            color: white; font-size: 1.2rem; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.25); padding: 8px 16px; border-radius: 20px;
        }
        .hud-item span { color: #ffd54f; }

        #gameOverScreen {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        #gameOverScreen h1 { font-size: 3rem; color: #ff8a65; margin-bottom: 10px; }
        #gameOverScreen p { color: white; font-size: 1.5rem; margin-bottom: 30px; }
        #restartBtn {
            padding: 15px 50px; font-size: 1.3rem; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #ff6f00, #d84315); color: white;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #restartBtn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,111,0,0.6); }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="stitch-art">🌺</div>
        <h1>Lilo & Stitch</h1>
        <h2>Aventura na Praia</h2>
        <button id="startBtn">Jogar</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">🌺 Pontos: <span id="score">0</span></div>
        <div class="hud-item">❤️ Vidas: <span id="lives">3</span></div>
        <div class="hud-item">🌊 Nível: <span id="level">1</span></div>
    </div>

    <div id="gameOverScreen">
        <h1>Fim de Jogo!</h1>
        <p>Pontuação final: <span id="finalScore">0</span></p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        let gameRunning = false, score = 0, lives = 3, level = 1;
        let spawnTimer = 0, shellTimer = 0, frame = 0;
        let particles = [], enemies = [], shells = [], waves = [];
        let invincible = false, invincibleTimer = 0;

        for (let i = 0; i < 5; i++) {
            waves.push({ x: i * W * 0.25, y: H * 0.58, speed: 0.6 + Math.random() * 0.4, phase: Math.random() * Math.PI * 2 });
        }

        const stitch = { x: 0, y: 0, w: 48, h: 48, vx: 0, vy: 0, speed: 5.5, emoji: '👽' };

        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        let mouseX = 0, mouseY = 0, mouseDown = false;
        canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('touchstart', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; mouseDown = true; });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });
        canvas.addEventListener('touchend', () => mouseDown = false);

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const spd = 1.8 + level * 0.4;
            if (side === 0) { x = -30; y = Math.random() * (H * 0.55); vx = spd; vy = (Math.random()-0.5)*1.5; }
            else if (side === 1) { x = W+30; y = Math.random() * (H*0.55); vx = -spd; vy = (Math.random()-0.5)*1.5; }
            else if (side === 2) { x = Math.random()*W; y = -30; vx = (Math.random()-0.5)*1.5; vy = spd; }
            else { x = Math.random()*W; y = -30; vx = (Math.random()-0.5)*1.5; vy = spd; }

            const types = ['🦀','🐚','🐙','🦞','🐡'];
            enemies.push({ x, y, vx, vy, w: 28+Math.random()*10, h: 28+Math.random()*10, type: types[Math.floor(Math.random()*types.length)] });
        }

        function spawnShell() {
            shells.push({ x: Math.random()*(W-60)+30, y: -20, vy: 1.2+Math.random(), w: 22, h: 22 });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7,
                    life: 25+Math.random()*15, maxLife: 40, color, size: 3+Math.random()*3 });
            }
        }

        function drawBeach() {
            // sky
            const sky = ctx.createLinearGradient(0, 0, 0, H * 0.45);
            sky.addColorStop(0, '#ff7043'); sky.addColorStop(0.4, '#ffb74d'); sky.addColorStop(1, '#81d4fa');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.5);

            // sun
            const sunX = W * 0.8, sunY = H * 0.18;
            const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 60);
            sg.addColorStop(0, 'rgba(255,241,118,1)'); sg.addColorStop(0.5, 'rgba(255,183,77,0.6)');
            sg.addColorStop(1, 'rgba(255,183,77,0)');
            ctx.fillStyle = sg; ctx.fillRect(sunX-80, sunY-80, 160, 160);
            ctx.beginPath(); ctx.arc(sunX, sunY, 30, 0, Math.PI*2);
            ctx.fillStyle = '#fff9c4'; ctx.fill();

            // clouds
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            const cloudY = H * 0.12;
            for (let i = 0; i < 4; i++) {
                const cx = ((i * W * 0.3 + frame * 0.3) % (W + 200)) - 100;
                ctx.beginPath(); ctx.arc(cx, cloudY + i*20, 25, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx+20, cloudY+10+i*20, 20, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx-15, cloudY+12+i*20, 18, 0, Math.PI*2); ctx.fill();
            }

            // water
            const waterY = H * 0.45;
            const waterGrad = ctx.createLinearGradient(0, waterY, 0, H * 0.65);
            waterGrad.addColorStop(0, '#0288d1'); waterGrad.addColorStop(1, '#01579b');
            ctx.fillStyle = waterGrad; ctx.fillRect(0, waterY, W, H * 0.2);

            // waves
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
            for (const w of waves) {
                ctx.beginPath();
                for (let x = 0; x <= W; x += 5) {
                    const y = waterY + Math.sin(x * 0.01 + w.phase + frame * 0.03) * 6 + 15;
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
                w.phase += 0.005;
            }

            // sand
            const sandY = H * 0.62;
            const sand = ctx.createLinearGradient(0, sandY, 0, H);
            sand.addColorStop(0, '#fdd835'); sand.addColorStop(0.4, '#f9a825'); sand.addColorStop(1, '#e65100');
            ctx.fillStyle = sand; ctx.fillRect(0, sandY, W, H - sandY);

            // sand sparkles
            for (let i = 0; i < 15; i++) {
                const sx = (i * 173 + frame * 0.15) % W;
                const sy = sandY + 10 + (i * 67) % (H * 0.35);
                ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(frame*0.06+i)*0.2})`;
                ctx.fillRect(sx, sy, 2, 2);
            }

            // palm tree
            drawPalm(W * 0.08, H * 0.58);
            drawPalm(W * 0.92, H * 0.56);
            if (level > 2) drawPalm(W * 0.5, H * 0.54);
        }

        function drawPalm(x, baseY) {
            ctx.fillStyle = '#5d4037';
            ctx.beginPath();
            ctx.moveTo(x - 6, baseY); ctx.lineTo(x + 6, baseY);
            ctx.lineTo(x + 4, baseY - 90); ctx.lineTo(x - 4, baseY - 90);
            ctx.fill();

            const topX = x, topY = baseY - 90;
            ctx.fillStyle = '#2e7d32';
            for (let a = 0; a < 6; a++) {
                const angle = (a / 6) * Math.PI * 2 + Math.sin(frame * 0.02 + a) * 0.1;
                ctx.beginPath();
                ctx.moveTo(topX, topY);
                const ex = topX + Math.cos(angle) * 50;
                const ey = topY + Math.sin(angle) * 20 - 10;
                ctx.quadraticCurveTo(topX + Math.cos(angle) * 25, topY + Math.sin(angle) * 5 - 20, ex, ey);
                ctx.quadraticCurveTo(topX + Math.cos(angle) * 25, topY + Math.sin(angle) * 5 + 5, topX, topY);
                ctx.fill();
            }
        }

        function update() {
            frame++;

            stitch.vx = 0; stitch.vy = 0;
            if (keys['ArrowLeft'] || keys['a']) stitch.vx = -stitch.speed;
            if (keys['ArrowRight'] || keys['d']) stitch.vx = stitch.speed;
            if (keys['ArrowUp'] || keys['w']) stitch.vy = -stitch.speed;
            if (keys['ArrowDown'] || keys['s']) stitch.vy = stitch.speed;

            if (mouseDown) {
                const dx = mouseX - stitch.x, dy = mouseY - stitch.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 5) { stitch.vx = (dx/dist)*stitch.speed; stitch.vy = (dy/dist)*stitch.speed; }
            }

            stitch.x += stitch.vx; stitch.y += stitch.vy;
            stitch.x = Math.max(stitch.w/2, Math.min(W-stitch.w/2, stitch.x));
            stitch.y = Math.max(stitch.h/2, Math.min(H-stitch.h/2, stitch.y));

            if (invincible) { invincibleTimer--; if (invincibleTimer <= 0) invincible = false; }

            spawnTimer++;
            if (spawnTimer > Math.max(35, 80 - level * 4)) { spawnEnemy(); spawnTimer = 0; }

            shellTimer++;
            if (shellTimer > 250) { spawnShell(); shellTimer = 0; }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i]; e.x += e.vx; e.y += e.vy;
                if (e.x < -50 || e.x > W+50 || e.y < -50 || e.y > H+50) { enemies.splice(i,1); continue; }
                const dx = stitch.x-e.x, dy = stitch.y-e.y;
                if (Math.sqrt(dx*dx+dy*dy) < stitch.w/2 + e.w/2) {
                    if (!invincible) {
                        lives--; createParticles(stitch.x, stitch.y, '#ff5252', 15);
                        invincible = true; invincibleTimer = 80;
                        if (lives <= 0) { gameOver(); return; }
                    }
                    createParticles(e.x, e.y, '#ffb74d', 10); enemies.splice(i,1);
                }
            }

            for (let i = shells.length - 1; i >= 0; i--) {
                const s = shells[i]; s.y += s.vy;
                if (s.y > H + 20) { shells.splice(i,1); continue; }
                const dx = stitch.x-s.x, dy = stitch.y-s.y;
                if (Math.sqrt(dx*dx+dy*dy) < stitch.w/2 + s.w/2) {
                    score += 50; createParticles(s.x, s.y, '#ffd54f', 20); shells.splice(i,1);
                }
            }

            if (score >= level * 200) { level++; createParticles(W/2, H/2, '#00e5ff', 30); }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
                if (p.life <= 0) particles.splice(i,1);
            }

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            drawBeach();

            ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            for (const s of shells) {
                ctx.save(); ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 15;
                ctx.fillText('🐚', s.x, s.y); ctx.restore();
            }

            for (const e of enemies) {
                ctx.font = `${e.w}px serif`;
                ctx.fillText(e.type, e.x, e.y);
            }

            ctx.save();
            if (invincible && Math.floor(frame/4)%2 === 0) ctx.globalAlpha = 0.35;
            if (invincible) { ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20; }
            ctx.font = `${stitch.w}px serif`;
            ctx.fillText(stitch.emoji, stitch.x, stitch.y);
            ctx.restore();

            for (const p of particles) {
                const a = p.life / p.maxLife;
                ctx.globalAlpha = a; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function resetGame() {
            score = 0; lives = 3; level = 1; spawnTimer = 0; shellTimer = 0; frame = 0;
            particles = []; enemies = []; shells = []; invincible = false;
            stitch.x = W/2; stitch.y = H/2; stitch.vx = 0; stitch.vy = 0;
            gameRunning = true;
        }

        function loop() { if (gameRunning) { update(); draw(); } requestAnimationFrame(loop); }

        document.getElementById('startBtn').addEventListener('click', () => { document.getElementById('startScreen').style.display = 'none'; resetGame(); });
        document.getElementById('restartBtn').addEventListener('click', () => { document.getElementById('gameOverScreen').style.display = 'none'; resetGame(); });

        stitch.x = W/2; stitch.y = H/2;
        loop();
    </script>
</body>
</html>
